{{/*
=============================================================================
PodDisruptionBudget — ensures a minimum number of backend pods stay running
during voluntary disruptions (node drains, cluster upgrades, etc.).

Enabled only when podDisruptionBudget.enabled=true (set in values-prod.yaml).
=============================================================================
*/}}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "anchor-point.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anchor-point.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "anchor-point.selectorLabels" . | nindent 6 }}
{{- end }}
