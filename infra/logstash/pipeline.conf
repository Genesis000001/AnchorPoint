input {
  tcp {
    port => 5000
    codec => line
  }
}
filter {
  json { source => "message" }
  if [timestamp] {
    date { match => ["timestamp", "ISO8601"] timezone => "UTC" }
  }
  if ![service_name] {
    mutate { add_field => { "service_name" => "%{service}" } }
  }
  if ![environment] {
    mutate { add_field => { "environment" => "development" } }
  }
}
output {
  elasticsearch { hosts => ["localhost:9200"] index => "anchorpoint-logs-%{+YYYY.MM.dd}" }
}
