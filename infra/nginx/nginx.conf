resolver 127.0.0.11 ipv6=off valid=30s;

upstream anchorpoint_dashboard {
    zone anchorpoint_dashboard 64k;
    server dashboard:80 resolve;
    keepalive 16;
}

upstream anchorpoint_backend {
    zone anchorpoint_backend 64k;
    least_conn;
    server backend-1:3002 resolve max_fails=3 fail_timeout=30s;
    server backend-2:3002 resolve max_fails=3 fail_timeout=30s;
    server backend-3:3002 resolve max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://anchorpoint_backend/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://anchorpoint_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /.well-known/stellar.toml {
        proxy_pass http://anchorpoint_backend/.well-known/stellar.toml;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /info {
        proxy_pass http://anchorpoint_backend/info;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /auth {
        proxy_pass http://anchorpoint_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /sep10 {
        proxy_pass http://anchorpoint_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /sep24 {
        proxy_pass http://anchorpoint_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /sep38 {
        proxy_pass http://anchorpoint_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://anchorpoint_dashboard;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
