name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: Production API base URL (TARGET_HOST)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "scripts/smoke-test.sh"
      - "scripts/smoke-test.selftest.mjs"
      - "docker-compose.prod.yml"
      - ".github/workflows/production-deploy.yml"

jobs:
  smoke-script-selftest:
    name: Smoke test script self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run synthetic smoke test against local mock endpoints
        run: node scripts/smoke-test.selftest.mjs

  production-smoke:
    name: Production endpoint smoke tests
    runs-on: ubuntu-latest
    needs: smoke-script-selftest
    if: ${{ github.event.inputs.target_host != '' || vars.TARGET_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run synthetic smoke tests
        env:
          TARGET_HOST: ${{ github.event.inputs.target_host || vars.TARGET_HOST }}
          SMOKE_TEST_ACCOUNT: ${{ secrets.SMOKE_TEST_ACCOUNT }}
        run: bash scripts/smoke-test.sh
